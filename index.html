<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoke Turner · Web Previews</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; padding: 24px;
  }
  .card {
    max-width: 420px; text-align: center; padding: 48px 40px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px; backdrop-filter: blur(4px);
  }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 20px; border-radius: 18px;
    background: #f8fafc;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.6; color: #94a3b8; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark"><img src="/assets/logo.png" alt="Smoke Turner logo"></div>
    <h1>Smoke Turner &middot; Web Previews</h1>
    <p>Private design previews for clients. Each preview is shared by direct link only.</p>
    <p style="margin-top:14px">Received a link from us? Use the full URL in your email.</p>
  </main>
</body>
</html>
